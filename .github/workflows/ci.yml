name: CI

# Lints and builds both apps, and checks that the Docker images build. Nothing is pushed or deployed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Check backend imports
        working-directory: backend
        run: |
          pip install -r requirements.txt
          DATA_DIR="$RUNNER_TEMP/data" python -c "import app.main"

      - name: Build Docker images
        run: docker compose build
